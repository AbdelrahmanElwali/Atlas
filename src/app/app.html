<div class="shell">
  <header class="top glass">
    <a routerLink="/" class="brand" aria-label="Atlas home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Atlas</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/countries" routerLinkActive="active">Countries</a>
    </nav>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.mode() === 'light'"
      [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (theme.mode() === 'dark') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
